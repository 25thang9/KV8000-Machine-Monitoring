{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập · KV8000 Monitoring</title>
    <link rel="stylesheet" href="{% static 'monitoring/dashboard.css' %}">
    <style>
        body{min-height:100vh;display:grid;place-items:center;padding:24px}
        .login-card{width:min(420px,100%);background:var(--surface,#fff);border:1px solid var(--border,#d9dee7);border-radius:18px;padding:28px;box-shadow:0 20px 55px rgba(15,23,42,.12)}
        .login-card h1{margin:0 0 8px;font-size:1.5rem}.login-card p{margin:0 0 22px;color:var(--muted,#64748b)}
        .login-card label{display:block;font-weight:700;margin:14px 0 6px}.login-card input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--border,#cbd5e1);border-radius:10px}
        .login-card button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer}
        .login-error{padding:10px 12px;border-radius:10px;background:#fff1f2;color:#be123c;margin-bottom:12px}
    </style>
</head>
<body>
<main class="login-card">
    <h1>KV8000 Machine Monitoring</h1>
    <p>Đăng nhập bằng tài khoản nội bộ để xem dashboard.</p>
    {% if form.errors %}<div class="login-error">Tên đăng nhập hoặc mật khẩu không đúng.</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="id_username">Tài khoản</label>
        {{ form.username }}
        <label for="id_password">Mật khẩu</label>
        {{ form.password }}
        <button type="submit">ĐĂNG NHẬP</button>
    </form>
</main>
</body>
</html>
